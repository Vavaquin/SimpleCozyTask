<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Cozy Tasks</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
</head>
<body>


<nav id="navbar">
    <span id="app-title">🌸 Simple Cozy Tasks</span>
    <div id="nav-buttons">
        <button class="nav-btn active" id="btn-calendar" onclick="setView('calendar')">📅 Calendário</button>
        <button class="nav-btn" id="btn-stats"    onclick="setView('stats')">📊 Estatísticas</button>
        <button class="nav-btn" id="btn-single"   onclick="setView('single')">📋 Lista Geral</button>
    </div>
</nav>


<div id="month-nav">
    <button class="month-arrow" onclick="prevMonth()">‹</button>
    <span id="month-label"></span>
    <button class="month-arrow" onclick="nextMonth()">›</button>
</div>

<div id="view-calendar">
    <div id="days-grid"></div>
</div>


<div id="view-stats" style="display:none">
    <div id="stats-container"></div>
</div>


<!-- ── Nova aba: Lista Geral ─────────────────────────────────────────────── -->
<div id="view-single" style="display:none">
    <div id="single-container">

        <div id="single-adicionar">
            <input  type="text"
                    id="single-task-input"
                    placeholder="Nova tarefa..."
                    maxlength="200">
            <textarea id="single-task-desc"
                      placeholder="Descrição (opcional)"
                      maxlength="500"></textarea>
            <div id="single-actions">
                <button onclick="singleAddTask()" id="btn-single-add">Adicionar Tarefa</button>
                <button onclick="singleClearAll()" id="btn-single-clear">🗑 Limpar tudo</button>
            </div>
        </div>

        <div id="single-tarefas"></div>

    </div>
</div>
<!-- ── Fim da nova aba ───────────────────────────────────────────────────── -->


<div id="modal-overlay" onclick="closeModal(event)">
    <div id="modal">
        <div id="modal-header">
            <span id="modal-day-title"></span>
            <button id="modal-close" onclick="closeModalForce()">✕</button>
        </div>

        
        <div id="adicionar">
            <input type="text" id="task-input" placeholder="Nova tarefa..." maxlength="200">
            <textarea id="task-desc" placeholder="Descrição (opcional)" maxlength="500"></textarea>
            
            
            <div id="subtask-section">
                <div id="subtask-list"></div>
                <div id="subtask-add-row">
                    <input type="text" id="subtask-input" placeholder="Adicionar sub-tarefa..." maxlength="200">
                    <button onclick="addSubtaskField()" id="btn-add-sub">+</button>
                </div>
            </div>

            <button onclick="addTask()" id="btn-add-task">Adicionar Tarefa</button>
        </div>

        
        <div id="tarefas"></div>
    </div>
</div>

<script src="tarefas.js"></script>
<script src="tarefassingle.js"></script>


</body>
</html>
